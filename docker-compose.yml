services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: docker/dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/dockerfile
    volumes:
      - react_build:/frontend/app

  nginx:
    image: nginx:latest
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx-setup.config:/etc/nginx/conf.d/default.config:ro
      - react_build:/var/www/frontend
    depends_on:
      - backend
      - frontend

volumes:
  react_build:
  
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge