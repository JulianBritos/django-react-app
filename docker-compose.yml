services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # Aquí montamos el archivo init.sql
    networks:
      - backend-network
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: docker/dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/dockerfile
    ports:
      - "3000:3000"
    networks:
      - backend-network

volumes:
  react_build:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge